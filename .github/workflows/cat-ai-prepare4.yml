name: Prepare AI Preview 4 Formatting
on:
  push:
    branches: [cat-termix/prepare-ai-preview4]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cat-ai-prepare4
  cancel-in-progress: true
defaults:
  run:
    shell: bash
env:
  BASE_SHA: 07d1001cd7d55f60ecfafacda983c9d73d8edff4
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
  HUSKY: '0'
jobs:
  format:
    if: github.repository == 'luoquan0/Cat-Termix'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 07d1001cd7d55f60ecfafacda983c9d73d8edff4
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Stabilize formatting without changing source behavior
        run: |
          mkdir -p /tmp/cat-ai-format4
          npx prettier --write plugins/ai/src/backend/routes.ts plugins/ai/src/backend/update-settings.ts
          npx prettier --check plugins/ai/src/backend/routes.ts plugins/ai/src/backend/update-settings.ts
          git diff --check
          git diff > /tmp/cat-ai-format4/format.patch
      - name: Store the two formatted blobs for review without updating refs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const paths=['plugins/ai/src/backend/routes.ts','plugins/ai/src/backend/update-settings.ts'];
          const entries=[];
          for(const path of paths){
            const before=execFileSync('git',['show',`${process.env.BASE_SHA}:${path}`],{encoding:'utf8'});
            const content=fs.readFileSync(path,'utf8');
            if(before.replace(/\s/g,'')!==content.replace(/\s/g,''))throw new Error('Unexpected non-whitespace change');
            const response=await fetch('https://api.github.com/repos/luoquan0/Cat-Termix/git/blobs',{
              method:'POST',headers:{Authorization:`Bearer ${process.env.GH_TOKEN}`,Accept:'application/vnd.github+json','Content-Type':'application/json'},
              body:JSON.stringify({content,encoding:'utf-8'})
            });
            if(!response.ok)throw new Error(`Blob upload failed: ${response.status}`);
            const {sha}=await response.json();entries.push({path,mode:'100644',type:'blob',sha});
            fs.writeFileSync('/tmp/cat-ai-format4/'+path.split('/').at(-1),content);
          }
          fs.writeFileSync('/tmp/cat-ai-format4/metadata.json',JSON.stringify({base:process.env.BASE_SHA,entries},null,2));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-ai-format4-${{ github.run_id }}
          path: /tmp/cat-ai-format4
          retention-days: 7
