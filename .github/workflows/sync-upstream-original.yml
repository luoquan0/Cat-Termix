name: Sync pristine Termix upstream baseline

on:
  push:
    branches:
      - automation/upstream-original-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact upstream main snapshot
        uses: actions/checkout@v4
        with:
          repository: Termix-SSH/Termix
          ref: bf67af7dfa3b649d68643eb9de2727f51ee89e53
          fetch-depth: 0
          path: upstream
          persist-credentials: false

      - name: Verify exact upstream source
        working-directory: upstream
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "bf67af7dfa3b649d68643eb9de2727f51ee89e53"
          test "$(git rev-parse 'HEAD^{tree}')" = "45eedca4452561a3bb77b73ea6b7c48787dafe4f"
          test -f src/ui/plugins/PluginsTab.tsx
          test -f src/backend/plugins/registry-index.ts
          test -f src/ui/sidebar/rail-items.ts
          test -f docker/bundled-plugins.json
          test -f packages/plugin-sdk/PLUGIN-GUIDE.md
          echo "Verified exact upstream source."

      - name: Create clean source snapshot without workflow files
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p /tmp/termix-upstream-snapshot
          git archive HEAD | tar -x -C /tmp/termix-upstream-snapshot
          rm -rf /tmp/termix-upstream-snapshot/.github/workflows
          cd /tmp/termix-upstream-snapshot
          git init
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(sync): pristine Termix upstream main snapshot bf67af7"
          echo "Snapshot commit: $(git rev-parse HEAD)"
          echo "Snapshot tree: $(git rev-parse 'HEAD^{tree}')"
          echo "Runtime source files: $(git ls-files | wc -l)"

      - name: Push clean upstream source to isolated branch
        working-directory: /tmp/termix-upstream-snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          git remote add cat-target "https://x-access-token:${GH_TOKEN}@github.com/${TARGET_REPO}.git"
          git push --force cat-target HEAD:refs/heads/cat-termix/upstream-original-26.11.1
          remote_sha="$(git ls-remote cat-target refs/heads/cat-termix/upstream-original-26.11.1 | awk '{print $1}')"
          test "$remote_sha" = "$(git rev-parse HEAD)"
          echo "## Pristine upstream source snapshot" >> "$GITHUB_STEP_SUMMARY"
          echo "- Branch: `cat-termix/upstream-original-26.11.1`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream main commit: `bf67af7dfa3b649d68643eb9de2727f51ee89e53`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Snapshot commit: `$remote_sha`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Upstream workflow definitions are restored separately using the repository file API." >> "$GITHUB_STEP_SUMMARY"
