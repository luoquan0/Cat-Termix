name: Cat-Termix Preview

on:
  push:
    branches: [Cat-Termix]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cat-termix-preview-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/luoquan0/cat-termix
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"

jobs:
  verify:
    if: github.repository == 'luoquan0/Cat-Termix' && github.ref == 'refs/heads/Cat-Termix'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        id: deps
        run: npm ci
      - name: Core and affected plugin type checks
        run: |
          npm run type-check
          npm run typecheck --workspace @termix-plugin/ai
          npm run typecheck --workspace @termix-plugin/agent
          npm run typecheck --workspace @termix-plugin/ssh-terminal
      - name: Build application and bundled plugins
        run: |
          mkdir -p /tmp/cat-termix-reports
          npm run build 2>&1 | tee /tmp/cat-termix-reports/build.log
      - name: AI regression tests
        run: |
          mkdir -p /tmp/cat-termix-reports
          npm test --workspace @termix-plugin/ai 2>&1 | tee /tmp/cat-termix-reports/ai-tests.log
      - name: Agent device and policy regression tests
        run: npm test --workspace @termix-plugin/agent
      - name: Terminal regression tests
        run: npm test --workspace @termix-plugin/ssh-terminal 2>&1 | tee /tmp/cat-termix-reports/terminal-tests.log
      - name: Update helper tests and Docker rollback smoke
        run: |
          node --test docker/updater/updater.test.mjs
          node docker/updater/smoke.mjs
          docker compose -f docker-compose.ai-test.yml -f docker-compose.ai-updates.yml config --quiet
      - name: Core regression tests
        run: npm test 2>&1 | tee /tmp/cat-termix-reports/core-tests.log
      - name: Lint changed source
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          mkdir -p /tmp/cat-termix-reports
          git diff --diff-filter=ACM --name-only -z 3ff60c1446a0ef4c5eea621e54ca41b4c18dba25 HEAD -- '*.ts' '*.tsx' | xargs -0 -r npx eslint 2>&1 | tee /tmp/cat-termix-reports/lint.log
      - name: Verify formatting and retain repair diff
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          mkdir -p /tmp/cat-termix-reports
          git diff --diff-filter=ACM --name-only -z 3ff60c1446a0ef4c5eea621e54ca41b4c18dba25 HEAD -- '*.ts' '*.tsx' '*.json' | xargs -0 -r npx prettier --write
          git diff --binary > /tmp/cat-termix-reports/format.patch
          git diff --exit-code
      - name: Archive exact source and reports
        if: always()
        run: |
          mkdir -p /tmp/cat-termix-reports
          git archive --format=tar.gz --prefix=Cat-Termix/ -o /tmp/cat-termix-reports/source.tar.gz HEAD
          echo "$GITHUB_SHA" > /tmp/cat-termix-reports/source-sha.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-termix-validation-${{ github.run_id }}
          path: /tmp/cat-termix-reports
          retention-days: 7

  image:
    needs: verify
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
        with:
          buildkitd-config-inline: |
            [worker.oci]
              max-parallelism = 2
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push architecture-specific candidate
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ env.IMAGE }}:build-${{ github.sha }}-${{ matrix.arch }}
          cache-from: type=gha,scope=cat-termix-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=cat-termix-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=2.9.2-ai-preview.9
            org.opencontainers.image.title=Cat-Termix AI Preview
      - name: Start the exact image and check health, web and bundled AI
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/cat-termix-image
          trap 'docker logs cat-termix-smoke > /tmp/cat-termix-image/container.log 2>&1 || true; docker rm -fv cat-termix-smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name cat-termix-smoke -p 127.0.0.1:19080:8080 "$IMAGE@$DIGEST"
          ready=false
          for attempt in $(seq 1 60); do
            if docker exec cat-termix-smoke wget -q -O /dev/null http://localhost:30001/health && curl -fsS http://127.0.0.1:19080/ > /tmp/cat-termix-image/index.html; then
              ready=true
              break
            fi
            sleep 3
          done
          test "$ready" = true
          grep -q 'id="root"' /tmp/cat-termix-image/index.html
          docker exec cat-termix-smoke test -s /app/dist/plugins/ai/dist/frontend.js
          docker exec cat-termix-smoke test -s /app/dist/plugins/ai/dist/backend.js
          docker exec cat-termix-smoke test -s /app/dist/plugins/agent/dist/backend.js
          docker exec cat-termix-smoke test -s /app/dist/plugins/agent/dist/frontend.js
          # The host's mapped loopback port reaches the container through Docker
          # bridge NAT and is NOT a loopback Agent client. Run protocol smoke
          # from inside the container instead of weakening HTTP/CIDR security.
          # /health can become available before bundled plugins finish activation.
          # Wait for the plugin router itself, not just the core process.
          agent_ready=false
          for attempt in $(seq 1 60); do
            if docker exec cat-termix-smoke wget -q -O - http://127.0.0.1:8080/agent/v1/health > /tmp/cat-termix-image/agent-health.json; then
              agent_ready=true
              break
            fi
            sleep 2
          done
          if [ "$agent_ready" != true ]; then
            echo "Agent route was not ready after 120 seconds" >&2
            docker exec cat-termix-smoke wget -S -O - http://127.0.0.1:8080/agent/v1/health || true
            docker logs cat-termix-smoke | tail -n 150
            exit 1
          fi
          docker cp docker/agent/preview-smoke.mjs cat-termix-smoke:/tmp/agent-preview-smoke.mjs
          docker exec -e CAT_TERMIX_SMOKE_URL=http://127.0.0.1:8080 cat-termix-smoke node /tmp/agent-preview-smoke.mjs
          grep -q '"status":"ok"' /tmp/cat-termix-image/agent-health.json
          docker exec cat-termix-smoke test -s /app/dist/plugins/ssh-terminal/dist/frontend.js
          printf '%s\n' "$IMAGE@$DIGEST" > /tmp/cat-termix-image/image.txt
          echo "Native ${{ matrix.arch }} startup checks passed: $IMAGE@$DIGEST" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-termix-image-${{ matrix.arch }}-${{ github.run_id }}
          path: /tmp/cat-termix-image
          if-no-files-found: ignore
          retention-days: 7

  publish:
    needs: [verify, image]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish verified AMD64 preview without updating the stable rolling tag
        run: |
          docker buildx imagetools create \
            --tag "$IMAGE:sha-$GITHUB_SHA" \
            --tag "$IMAGE:2.9.2-ai-preview.9" \
            "$IMAGE:build-$GITHUB_SHA-amd64"
          mkdir -p /tmp/cat-termix-release
          docker buildx imagetools inspect "$IMAGE:sha-$GITHUB_SHA" | tee /tmp/cat-termix-release/manifest.txt
          printf 'Source: %s\nPreview image: %s\nPinned tag: %s\nRolling ai-dev: unchanged (Preview 8)\nArchitecture: linux/amd64\n' "$GITHUB_SHA" "$IMAGE:2.9.2-ai-preview.9" "$IMAGE:sha-$GITHUB_SHA" | tee /tmp/cat-termix-release/release.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Check anonymous image access
        run: |
          if DOCKER_CONFIG="$(mktemp -d)" docker manifest inspect "$IMAGE:2.9.2-ai-preview.9" > /tmp/cat-termix-release/anonymous-manifest.json; then
            echo "Anonymous pull: available" | tee /tmp/cat-termix-release/access.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Anonymous pull: requires GHCR login or changing package visibility to public" | tee /tmp/cat-termix-release/access.txt >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: cat-termix-release-${{ github.run_id }}
          path: /tmp/cat-termix-release
          retention-days: 30
