name: Cat-Termix One-Shot Formatter

on:
  push:
    paths:
      - .github/workflows/cat-termix-one-shot-formatter.yml

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'luoquan0/Cat-Termix' && github.ref == 'refs/heads/Cat-Termix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Install locked dependencies
        env:
          HUSKY: "0"
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
        run: npm ci
      - name: Format only the new Agent sources and manifests
        run: |
          npx prettier --write 'plugins/agent/**/*.{ts,tsx,json}' docker/bundled-plugins.json
          git add plugins/agent docker/bundled-plugins.json
          if git diff --cached --quiet; then
            echo "Agent sources already formatted"
            exit 0
          fi
          git config user.name github-actions
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "style(agent): apply canonical Prettier formatting"
          # Fast-forward only: cannot overwrite a newer source revision.
          git push origin HEAD:Cat-Termix
