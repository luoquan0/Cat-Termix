name: Cat-Termix v13 Format Candidate

on:
  push:
    branches: [fix/chat-multi-model-settings]

permissions:
  contents: write

jobs:
  format:
    if: github.repository == 'luoquan0/Cat-Termix'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HUSKY: "0"
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Format only two reported test files
        run: |
          set -euo pipefail
          npx prettier --write \
            plugins/ai/tests/frontend/AiPanel-settings.test.tsx \
            plugins/ai/tests/frontend/AiSessionControls.test.tsx
          git add \
            plugins/ai/tests/frontend/AiPanel-settings.test.tsx \
            plugins/ai/tests/frontend/AiSessionControls.test.tsx
          git diff --cached --check
          mkdir -p /tmp/v13-format
          git diff --cached --binary > /tmp/v13-format/format.patch
          echo "Formatting delta (test files only):" >> "$GITHUB_STEP_SUMMARY"
          git diff --cached --stat >> "$GITHUB_STEP_SUMMARY"
      - name: Publish isolated formatted source commit without changing release branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          tree="$(git write-tree)"
          candidate="$(printf 'style(ai): format multi-model settings tests\n' | git commit-tree "$tree" -p "$GITHUB_SHA")"
          echo "$candidate" > /tmp/v13-format/commit.txt
          echo "$tree" > /tmp/v13-format/tree.txt
          basic="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" \
            push "https://github.com/$GITHUB_REPOSITORY.git" "$candidate:refs/heads/cat-termix-v13-formatted-$GITHUB_RUN_ID"
          printf 'Formatted candidate: %s\n' "$candidate" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-termix-v13-format-${{ github.run_id }}
          path: /tmp/v13-format
          if-no-files-found: ignore
          retention-days: 7
