name: Cat-Termix Official Agent Release

# Runs only when this release workflow itself is introduced/edited.
# Normal development commits must never promote the rolling ai-dev image.
on:
  push:
    branches: [Cat-Termix]
    paths:
      - ".github/workflows/cat-termix-official-release.yml"

permissions:
  contents: write
  packages: write
  actions: read

concurrency:
  group: cat-termix-agent-official-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  IMAGE: ghcr.io/luoquan0/cat-termix
  SOURCE_SHA: b8f9a5fa9cd2770de78721570173ad12f104dea4
  PREVIEW_DIGEST: sha256:02fe31a3c4a1fa019b38e04d57246fb8816b6661901fd29ca9045dec3aeba4c5
  PREVIOUS_DIGEST: sha256:37b4a279f7d25d6152c039e2ea98055dbc4186b5cfc8930892c6588ec99005af
  RELEASE_IMAGE_TAG: "2.9.2-cat-termix.9"
  RELEASE_TAG: "v2.9.2-cat-termix.9"
  VERIFIED_RUN_ID: "38043099924"

jobs:
  promote:
    if: github.repository == 'luoquan0/Cat-Termix' && github.ref == 'refs/heads/Cat-Termix'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify exact tested commit and successful CI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq .conclusion)" = "success"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$VERIFIED_RUN_ID" --jq .head_sha)" = "$SOURCE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/$SOURCE_SHA" --jq .sha)" = "$SOURCE_SHA"
          if gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            tag_commit="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)"
            test "$tag_commit" = "$SOURCE_SHA" || { echo "Existing release does not refer to verified source" >&2; exit 1; }
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Promote verified AMD64 image and inspect rolling tag
        run: |
          set -euo pipefail
          # GHCR may briefly return an empty response; log the actual registry
          # failure rather than letting a silent pipe exit 255 abort this release.
          docker buildx version
          index_digest() {
            local ref="$1" attempt body digest
            for attempt in 1 2 3 4; do
              echo "Inspecting registry manifest: $ref (attempt $attempt)" >&2
              if body="$(docker buildx imagetools inspect "$ref" 2>&1)"; then
                digest="$(printf '%s\n' "$body" | awk '$1 == "Digest:" { print $2; exit }')"
                if [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
                  echo "Digest for $ref: $digest" >&2
                  printf '%s\n' "$digest"
                  return 0
                fi
                echo "Unrecognized image manifest output: $body" >&2
              else
                echo "Image inspect failed: $body" >&2
              fi
              sleep 4
            done
            return 1
          }
          tested="$(index_digest "$IMAGE:sha-$SOURCE_SHA")"
          previous="$(index_digest "$IMAGE:ai-dev")"
          rollback="$(index_digest "$IMAGE:2.9.2-ai-preview.8")"
          test "$tested" = "$PREVIEW_DIGEST" || { echo "Verified new digest mismatch: $tested" >&2; exit 1; }
          test "$rollback" = "$PREVIOUS_DIGEST" || { echo "Rollback digest mismatch: $rollback" >&2; exit 1; }
          if [ "$previous" != "$PREVIOUS_DIGEST" ] && [ "$previous" != "$PREVIEW_DIGEST" ]; then
            echo "Rolling tag changed unexpectedly: $previous" >&2
            exit 1
          fi
          docker buildx imagetools create \
            --tag "$IMAGE:$RELEASE_IMAGE_TAG" \
            --tag "$IMAGE:ai-dev" \
            "$IMAGE:sha-$SOURCE_SHA"
          test "$(index_digest "$IMAGE:ai-dev")" = "$PREVIEW_DIGEST"
          test "$(index_digest "$IMAGE:$RELEASE_IMAGE_TAG")" = "$PREVIEW_DIGEST"
          anonymous_config="$(mktemp -d)"
          DOCKER_CONFIG="$anonymous_config" docker manifest inspect "$IMAGE:ai-dev" > /tmp/cat-termix-official-anonymous-manifest.json
          echo "Rolling ai-dev and official fixed tag: $PREVIEW_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Rollback image retained: $IMAGE:2.9.2-ai-preview.8" >> "$GITHUB_STEP_SUMMARY"
      - name: Create and verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Creating the lightweight tag separately avoids relying on GitHub
          # Releases' implicit tag creation path. Never force-move an existing tag.
          if ! gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Creating immutable tag refs/tags/$RELEASE_TAG at verified source $SOURCE_SHA"
            gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f "ref=refs/tags/$RELEASE_TAG" -f "sha=$SOURCE_SHA" \
              --jq '.ref'
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          if ! gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release create "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --verify-tag \
              --target "$SOURCE_SHA" \
              --title "Cat-Termix 2.9.2 - AI + Local Agent" \
              --notes-file docs/releases/v2.9.2-cat-termix.9.md \
              --latest
          fi
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_TAG" --jq .object.sha)" = "$SOURCE_SHA"
          gh release view "$RELEASE_TAG" -R "$GITHUB_REPOSITORY" --json tagName,url,isPrerelease
          echo "Release: https://github.com/$GITHUB_REPOSITORY/releases/tag/$RELEASE_TAG" >> "$GITHUB_STEP_SUMMARY"
