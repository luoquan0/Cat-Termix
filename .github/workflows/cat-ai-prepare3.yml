name: Prepare AI Preview 3

on:
  push:
    branches: [cat-termix/prepare-ai-preview3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-ai-prepare3
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BASE_SHA: f3535af1430191507be637647df95a8e85356909
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"

jobs:
  prepare:
    if: github.repository == 'luoquan0/Cat-Termix'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Apply reviewed UI and read-only context changes
        run: |
          git apply --check .github/preview3-ui.patch .github/preview3-backend.patch
          git apply .github/preview3-ui.patch .github/preview3-backend.patch
          git add -N plugins docs .github/workflows/cat-termix-preview.yml
      - name: Install locked dependencies
        run: npm ci
      - name: Format changed source
        run: git diff --diff-filter=ACM --name-only -z "$BASE_SHA" -- '*.ts' '*.tsx' '*.json' | xargs -0 -r npx prettier --write
      - name: Type checks
        run: |
          npm run type-check
          npm run typecheck --workspace @termix-plugin/ai
          npm run typecheck --workspace @termix-plugin/ssh-terminal
      - name: AI and terminal regression tests
        run: |
          mkdir -p /tmp/cat-ai-prepared
          npm test --workspace @termix-plugin/ai 2>&1 | tee /tmp/cat-ai-prepared/ai-tests.log
          npm test --workspace @termix-plugin/ssh-terminal 2>&1 | tee /tmp/cat-ai-prepared/terminal-tests.log
      - name: Lint source changes
        run: git diff --diff-filter=ACM --name-only -z "$BASE_SHA" -- '*.ts' '*.tsx' | xargs -0 -r npx eslint
      - name: Store validated source blobs for manual review (no ref updates)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/cat-ai-prepared
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const repo = process.env.GITHUB_REPOSITORY;
          if (repo !== 'luoquan0/Cat-Termix') throw new Error('Unexpected repository');
          const names = execFileSync('git', ['diff', '--name-only', '-z', process.env.BASE_SHA, '--', 'plugins/ai', 'plugins/ssh-terminal', 'docs/cat-termix-ai-preview.md', '.github/workflows/cat-termix-preview.yml'], {encoding: 'utf8'}).split('\0').filter(Boolean);
          const entries = [];
          for (const path of names) {
            if (!(path.startsWith('plugins/ai/') || path.startsWith('plugins/ssh-terminal/') || path === 'docs/cat-termix-ai-preview.md' || path === '.github/workflows/cat-termix-preview.yml')) throw new Error('Unexpected path');
            const response = await fetch(`https://api.github.com/repos/${repo}/git/blobs`, {
              method: 'POST',
              headers: {Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json'},
              body: JSON.stringify({content: fs.readFileSync(path, 'utf8'), encoding: 'utf-8'}),
            });
            if (!response.ok) throw new Error(`Blob ${path}: ${response.status}`);
            const blob = await response.json();
            entries.push({path, mode: '100644', type: 'blob', sha: blob.sha});
          }
          fs.writeFileSync('/tmp/cat-ai-prepared/tree-elements.json', JSON.stringify({base: process.env.BASE_SHA, entries}, null, 2));
          console.log(`Validated ${entries.length} source files. No branch was changed.`);
          NODE
      - name: Archive reviewed source and reports
        if: always()
        run: |
          mkdir -p /tmp/cat-ai-prepared
          git diff "$BASE_SHA" -- plugins/ai plugins/ssh-terminal docs/cat-termix-ai-preview.md .github/workflows/cat-termix-preview.yml > /tmp/cat-ai-prepared/prepared.patch
          git diff --diff-filter=ACM --name-only -z "$BASE_SHA" -- plugins/ai plugins/ssh-terminal docs/cat-termix-ai-preview.md .github/workflows/cat-termix-preview.yml | tar --null -T - -czf /tmp/cat-ai-prepared/changed-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-ai-prepared3-${{ github.run_id }}
          path: /tmp/cat-ai-prepared
          retention-days: 7
