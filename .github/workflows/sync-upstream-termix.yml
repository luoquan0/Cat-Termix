name: Sync exact upstream Termix 2.9.2

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'luoquan0/Cat-Termix'
    runs-on: ubuntu-latest
    steps:
      - name: Replace repository contents from upstream release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git remote add upstream https://github.com/Termix-SSH/Termix.git
          git fetch --depth=1 upstream refs/tags/release-2.9.2-tag:refs/tags/release-2.9.2-tag
          git checkout -B sync origin/main
          git rm -r --ignore-unmatch .
          git checkout refs/tags/release-2.9.2-tag -- .
          git rm -rf --ignore-unmatch .github/workflows
          git checkout origin/main -- .github/workflows
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: reset code to upstream Termix 2.9.2"
          git push --force origin HEAD:refs/heads/main
