name: Cat-Termix v12 Validation

on:
  push:
    branches: [cat-termix-v12-validation]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: cat-termix-v12-validation
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  BASE: 1f26da0b78fdb6d0e5d2413683820c0a13a07ab5
  ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
  HUSKY: "0"

jobs:
  validate:
    if: github.repository == 'luoquan0/Cat-Termix' && github.ref == 'refs/heads/cat-termix-v12-validation'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm
      - name: Prepare exact scoped v12 source without changing a release branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/v12-input /tmp/v12-reports
          cp .github/v12-validation/* /tmp/v12-input/
          cat /tmp/v12-input/patch*.b64 | base64 --decode | gzip -dc > /tmp/v12.patch
          echo 'abf30497c8b67c456eb822eb3d0d39ef9b19e3def535bbdd7977f24e70d0ff2b  /tmp/v12.patch' | sha256sum -c -
          git checkout --detach "$BASE"
          git apply --check /tmp/v12.patch
          git apply --index /tmp/v12.patch
          python /tmp/v12-input/fixups.py
          git add docker/agent docker/nginx.conf docker/nginx-https.conf plugins/agent plugins/ai
      - name: Install locked dependencies
        id: deps
        run: npm ci
      - name: Format and archive prepared source
        run: |
          set -euo pipefail
          git diff --cached --name-only -z -- '*.ts' '*.tsx' '*.json' '*.mjs' | xargs -0 -r npx prettier --write
          git add docker/agent docker/nginx.conf docker/nginx-https.conf plugins/agent plugins/ai
          git diff --cached --binary > /tmp/v12-reports/prepared.patch
          git diff --cached --stat > /tmp/v12-reports/changed-files.txt
          tree=$(git write-tree)
          export GIT_AUTHOR_NAME='github-actions[bot]' GIT_COMMITTER_NAME='github-actions[bot]'
          export GIT_AUTHOR_EMAIL='41898282+github-actions[bot]@users.noreply.github.com'
          export GIT_COMMITTER_EMAIL="$GIT_AUTHOR_EMAIL"
          candidate=$(printf 'test: prepared v12 source for isolated validation\n' | git commit-tree "$tree" -p "$BASE")
          echo "$candidate" > /tmp/v12-reports/prepared-sha.txt
          echo "$tree" > /tmp/v12-reports/prepared-tree.txt
          git archive --format=tar.gz --prefix=Cat-Termix/ -o /tmp/v12-reports/source.tar.gz "$candidate"
          cat /tmp/v12-reports/changed-files.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Core and changed plugin type checks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          npm run type-check 2>&1 | tee /tmp/v12-reports/types-core.log
          npm run typecheck --workspace @termix-plugin/ai 2>&1 | tee /tmp/v12-reports/types-ai.log
          npm run typecheck --workspace @termix-plugin/agent 2>&1 | tee /tmp/v12-reports/types-agent.log
      - name: AI regression tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test --workspace @termix-plugin/ai -- --maxWorkers=2 2>&1 | tee /tmp/v12-reports/ai-tests.log
      - name: Agent regression tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: npm test --workspace @termix-plugin/agent -- --maxWorkers=2 2>&1 | tee /tmp/v12-reports/agent-tests.log
      - name: Transport and lint checks
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        run: |
          node --test docker/agent/transport-config.test.mjs
          git diff --cached --name-only -z -- '*.ts' '*.tsx' | xargs -0 -r npx eslint 2>&1 | tee /tmp/v12-reports/lint.log
          git diff --exit-code
      - name: Retain tested source as an isolated candidate, never update ai-dev or main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          candidate=$(cat /tmp/v12-reports/prepared-sha.txt)
          basic=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $basic" push https://github.com/luoquan0/Cat-Termix.git "$candidate:refs/heads/cat-termix-v12-candidate-$GITHUB_RUN_ID"
          printf 'Tested candidate: %s\nTree: %s\n' "$candidate" "$(cat /tmp/v12-reports/prepared-tree.txt)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cat-termix-v12-validation-${{ github.run_id }}
          path: /tmp/v12-reports
          retention-days: 7
